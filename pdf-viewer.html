<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>資料を表示 | 葉鹿下町自治会</title>
    <meta name="description" content="葉鹿下町自治会の回覧板資料を表示します。" />
    <link rel="stylesheet" href="styles.css?v=20261003-pdf-viewer" />
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>

    <header class="site-header">
      <nav class="nav-shell" aria-label="メインメニュー">
        <a class="brand" href="index.html" aria-label="葉鹿下町自治会 ホーム">
          <span class="brand-mark" aria-hidden="true">葉</span>
          <span>
            <strong>葉鹿下町自治会</strong>
            <small>栃木県足利市</small>
          </span>
        </a>
        <a class="back-link viewer-back-link" href="circular.html">回覧板へ戻る</a>
      </nav>
    </header>

    <main id="main" class="pdf-viewer-page">
      <section class="pdf-viewer-head" aria-labelledby="pdf-title">
        <a class="back-link" href="circular.html">← 回覧板へ戻る</a>
        <p class="eyebrow">Circular document</p>
        <h1 id="pdf-title">回覧板資料</h1>
        <p class="pdf-viewer-note">確認が終わったら、上の「回覧板へ戻る」から一覧に戻れます。</p>
      </section>
      <section class="pdf-frame-wrap" aria-label="PDF資料">
        <p id="pdf-loading" class="pdf-loading">資料を読み込んでいます…</p>
        <p class="pdf-error" hidden>資料を表示できませんでした。回覧板へ戻って、もう一度お試しください。</p>
        <div id="pdf-pages" class="pdf-pages" aria-live="polite"></div>
        <p class="pdf-original-link"><a id="pdf-original" class="text-link" href="#">PDFを別画面で開く</a></p>
      </section>
    </main>

    <script type="module">
      import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");
      const from = params.get("from");
      const requestedTitle = params.get("title");
      const pages = document.querySelector("#pdf-pages");
      const loading = document.querySelector("#pdf-loading");
      const error = document.querySelector(".pdf-error");
      const original = document.querySelector("#pdf-original");
      const title = document.querySelector("#pdf-title");
      const safeBack = from === "index.html" || from === "circular.html" ? from : "circular.html";

      document.querySelectorAll(".viewer-back-link, .pdf-viewer-head .back-link").forEach((link) => {
        link.href = safeBack;
      });

      if (file && file.startsWith("documents/") && file.endsWith(".pdf")) {
        original.href = file;
        const name = file.split("/").pop().replace(/\.pdf$/i, "").replace(/[-_]+/g, " ");
        title.textContent = requestedTitle || name || "回覧板資料";
        document.title = `${title.textContent} | 葉鹿下町自治会`;

        try {
          pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
          const pdf = await pdfjsLib.getDocument(file).promise;

          for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
            const page = await pdf.getPage(pageNumber);
            const baseViewport = page.getViewport({ scale: 1 });
            const availableWidth = Math.max(pages.clientWidth - 2, 280);
            const cssScale = Math.min(1.6, availableWidth / baseViewport.width);
            const viewport = page.getViewport({ scale: cssScale });
            const outputScale = window.devicePixelRatio || 1;
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d", { alpha: false });
            canvas.className = "pdf-page-image";
            canvas.setAttribute("aria-label", `${pageNumber}ページ目`);
            canvas.width = Math.floor(viewport.width * outputScale);
            canvas.height = Math.floor(viewport.height * outputScale);
            canvas.style.width = `${viewport.width}px`;
            canvas.style.height = `${viewport.height}px`;
            pages.append(canvas);

            await page.render({
              canvasContext: context,
              viewport,
              transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null,
            }).promise;
          }

          loading.hidden = true;
        } catch (loadError) {
          console.error(loadError);
          loading.hidden = true;
          error.hidden = false;
          original.hidden = false;
        }
      } else {
        loading.hidden = true;
        error.hidden = false;
        original.hidden = true;
      }
    </script>
  </body>
</html>
